<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Condo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 10px #ddd;
    }

    h1 {
      margin: 0;
    }

    .hero {
      padding: 60px 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 32px;
    }

    .search {
      max-width: 500px;
      margin: 30px auto;
    }

    input {
      width: 90%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 14px 25px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
    }

    .filters {
      margin-top: 20px;
    }

    .tag {
      display: inline-block;
      background: white;
      padding: 10px 15px;
      margin: 5px;
      border-radius: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>🐾 Pet Condo</h1>
</header>

<section class="hero">

  <h2>หาคอนโดที่สัตว์เลี้ยงอยู่ได้</h2>

  <p>
    ค้นหาคอนโดสำหรับคุณและเพื่อนตัวน้อย 🐶🐱
  </p>

  <div class="search">
    <input
      type="text"
      placeholder="ค้นหาคอนโด หรือทำเล..."
    >

    <br>

    <button>ค้นหาคอนโด</button>
  </div>

  <div class="filters">
    <span class="tag">🐶 เลี้ยงสุนัขได้</span>
    <span class="tag">🐱 เลี้ยงแมวได้</span>
  </div>

</section>

</body>
</html>
