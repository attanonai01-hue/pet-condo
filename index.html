<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pet Condo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f6f6f6;
  color: #222;
}

header {
  background: white;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #eee;
}

.logo {
  font-size: 22px;
  font-weight: 700;
}

.post-btn {
  background: #111;
  color: white;
  padding: 11px 15px;
  border-radius: 12px;
  text-decoration: none;
}

.hero {
  background: white;
  text-align: center;
  padding: 45px 20px 35px;
}

.hero h1 {
  margin: 0 0 10px;
  font-size: 32px;
}

.hero p {
  color: #777;
}

.search {
  width: 100%;
  max-width: 600px;
  margin-top: 20px;
  padding: 16px;
  border: 1px solid #ddd;
  border-radius: 14px;
  font-size: 16px;
}

.filters {
  margin-top: 15px;
}

.filter {
  display: inline-block;
  margin: 4px;
  padding: 9px 13px;
  background: #f2f2f2;
  border-radius: 20px;
  font-size: 14px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 25px 16px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px;
}

.card {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,.07);
}

.image {
  height: 180px;
  background: #e9e9e9;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
}

.content {
  padding: 18px;
}

.content h3 {
  margin: 0 0 8px;
}

.location {
  color: #777;
  margin-bottom: 10px;
}

.price {
  font-size: 20px;
  font-weight: 700;
}

.detail {
  display: block;
  margin-top: 15px;
  padding: 12px;
  text-align: center;
  background: #111;
  color: white;
  border-radius: 12px;
  text-decoration: none;
}

#status {
  padding: 25px;
  text-align: center;
  color: #777;
}

.error {
  color: #c62828 !important;
  background: #ffebee;
  border-radius: 14px;
  word-break: break-word;
}

footer {
  text-align: center;
  padding: 30px;
  color: #999;
}
</style>
</head>

<body>

<header>
  <div class="logo">🐾 Pet Condo</div>

  <a href="#" class="post-btn">
    + ลงประกาศ
  </a>
</header>


<section class="hero">

  <h1>หาคอนโดที่สัตว์เลี้ยงอยู่ได้</h1>

  <p>
    ค้นหาบ้านที่ใช่ สำหรับคุณและเพื่อนตัวน้อย 🐶🐱
  </p>

  <input
    id="search"
    class="search"
    placeholder="ค้นหาคอนโด หรือทำเล"
  >

  <div class="filters">
    <span class="filter">🐶 เลี้ยงสุนัขได้</span>
    <span class="filter">🐱 เลี้ยงแมวได้</span>
    <span class="filter">🚆 ใกล้ BTS/MRT</span>
  </div>

</section>


<main class="container">

<h2>คอนโดแนะนำ</h2>

<div id="status">
  กำลังโหลดประกาศ...
</div>

<div id="grid" class="grid"></div>

</main>


<footer>
© 2026 Pet Condo
</footer>


<script>

let allListings = [];


async function loadListings() {

  const status =
    document.getElementById("status");

  try {

    const response =
      await fetch("/api/listings", {
        cache: "no-store"
      });


    const text =
      await response.text();


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}: ${text}`
      );

    }


    const data =
      JSON.parse(text);


    allListings = data;


    renderListings(data);

  }

  catch (error) {

    console.error(error);

    status.className = "error";

    status.innerHTML =
      `
      ❌ โหลดข้อมูลไม่สำเร็จ
      <br><br>
      ${escapeHTML(error.message)}
      `;

  }

}



function renderListings(listings) {

  const grid =
    document.getElementById("grid");

  const status =
    document.getElementById("status");


  grid.innerHTML = "";


  if (!listings || listings.length === 0) {

    status.style.display = "block";

    status.innerHTML =
      "เชื่อมต่อ Database สำเร็จ ✅<br>แต่ไม่มีประกาศ";

    return;

  }


  status.style.display = "none";


  listings.forEach(item => {

    const card =
      document.createElement("div");


    card.className = "card";


    const price =
      Number(item.price || 0)
      .toLocaleString("th-TH");


    card.innerHTML = `

      <div class="image">
        🏢
      </div>

      <div class="content">

        <h3>
          ${escapeHTML(
            item.condo_name || "ไม่ระบุชื่อ"
          )}
        </h3>

        <div class="location">
          📍 ${escapeHTML(
            item.location || "ไม่ระบุทำเล"
          )}
        </div>

        <div class="price">
          ฿${price} / เดือน
        </div>

        <a
          href="condo.html?id=${encodeURIComponent(item.id || "")}"
          class="detail"
        >
          ดูรายละเอียด
        </a>

      </div>

    `;


    grid.appendChild(card);

  });

}



function escapeHTML(value) {

  return String(value)

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}



document
.getElementById("search")
.addEventListener(
  "input",
  function() {

    const keyword =
      this.value
      .toLowerCase()
      .trim();


    const result =
      allListings.filter(item => {

        const name =
          String(item.condo_name || "")
          .toLowerCase();

        const location =
          String(item.location || "")
          .toLowerCase();


        return (
          name.includes(keyword) ||
          location.includes(keyword)
        );

      });


    renderListings(result);

  }
);


loadListings();

</script>

</body>
</html>
