<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pet Condo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f6f6f6;
      color: #222;
    }

    header {
      background: white;

      padding: 16px 20px;

      display: flex;

      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid #eee;

      position: sticky;
      top: 0;

      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;

      color: #222;
      text-decoration: none;
    }

    .post-btn {
      background: #111;
      color: white;

      padding: 11px 15px;

      border-radius: 12px;

      text-decoration: none;
      font-weight: 600;
    }

    .hero {
      background: white;

      text-align: center;

      padding: 45px 20px 35px;
    }

    .hero h1 {
      margin: 0 0 10px;

      font-size: 32px;

      line-height: 1.3;
    }

    .hero p {
      margin: 0;

      color: #777;
    }

    .search-wrap {
      max-width: 620px;

      margin: 24px auto 0;
    }

    .search-input {
      width: 100%;

      padding: 16px;

      border: 1px solid #ddd;

      border-radius: 14px;

      font-size: 16px;

      outline: none;
    }

    .search-input:focus {
      border-color: #888;
    }

    .filters {
      margin-top: 16px;
    }

    .filter {
      display: inline-block;

      margin: 4px;

      padding: 9px 13px;

      background: #f1f1f1;

      border-radius: 999px;

      font-size: 14px;
    }

    .container {
      width: 100%;

      max-width: 1000px;

      margin: auto;

      padding: 26px 16px 45px;
    }

    .section-title {
      margin: 0 0 18px;

      font-size: 24px;
    }

    #status {
      text-align: center;

      padding: 30px 15px;

      color: #777;
    }

    #status.error {
      color: #b42318;

      background: #fff0ee;

      border-radius: 14px;

      padding: 18px;

      word-break: break-word;
    }

    .grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(260px, 1fr)
        );

      gap: 18px;
    }

    .card {
      background: white;

      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0 2px 14px
        rgba(0, 0, 0, 0.07);
    }

    .card-image {
      height: 180px;

      background:
        linear-gradient(
          135deg,
          #eeeeee,
          #d5d5d5
        );

      display: flex;

      justify-content: center;
      align-items: center;

      font-size: 60px;
    }

    .card-content {
      padding: 18px;
    }

    .card-title {
      margin: 0 0 8px;

      font-size: 20px;
    }

    .location {
      color: #777;

      line-height: 1.5;

      margin-bottom: 10px;
    }

    .pet-tags {
      margin: 10px 0;
    }

    .pet-tag {
      display: inline-block;

      background: #f2f2f2;

      padding: 7px 10px;

      border-radius: 10px;

      margin-right: 5px;
      margin-bottom: 5px;

      font-size: 13px;
    }

    .details {
      color: #666;

      font-size: 14px;

      margin-top: 8px;
    }

    .price {
      margin-top: 12px;

      font-size: 20px;

      font-weight: 700;
    }

    .detail-btn {
      display: block;

      margin-top: 16px;

      padding: 12px;

      background: #111;

      color: white;

      border-radius: 12px;

      text-align: center;

      text-decoration: none;

      font-weight: 600;
    }

    footer {
      text-align: center;

      padding: 30px 16px 40px;

      color: #999;
    }

    @media (max-width: 600px) {

      .hero {
        padding-top: 38px;
      }

      .hero h1 {
        font-size: 27px;
      }

      .container {
        padding-top: 22px;
      }

      .post-btn {
        padding: 10px 13px;
      }
    }
  </style>
</head>

<body>


<header>

  <a
    href="/"
    class="logo"
  >
    🐾 Pet Condo
  </a>


  <a
    href="/post.html"
    class="post-btn"
  >
    + ลงประกาศ
  </a>

</header>



<section class="hero">

  <h1>
    หาคอนโดที่สัตว์เลี้ยงอยู่ได้
  </h1>


  <p>
    ค้นหาบ้านที่ใช่
    สำหรับคุณและเพื่อนตัวน้อย 🐶🐱
  </p>


  <div class="search-wrap">

    <input
      id="searchInput"
      class="search-input"
      type="text"
      placeholder="ค้นหาคอนโด ทำเล หรือ BTS/MRT"
    >

  </div>


  <div class="filters">

    <span class="filter">
      🐶 เลี้ยงสุนัขได้
    </span>

    <span class="filter">
      🐱 เลี้ยงแมวได้
    </span>

    <span class="filter">
      🚆 ใกล้ BTS/MRT
    </span>

  </div>

</section>



<main class="container">


  <h2 class="section-title">
    คอนโดแนะนำ
  </h2>


  <div id="status">
    กำลังโหลดประกาศ...
  </div>


  <div
    id="listingGrid"
    class="grid"
  ></div>


</main>



<footer>
  © 2026 Pet Condo
</footer>



<script>


let allListings = [];



function escapeHTML(value) {

  return String(value ?? "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



function formatPrice(value) {

  return Number(
    value || 0
  ).toLocaleString(
    "th-TH"
  );

}



function renderListings(
  listings
) {

  const grid =
    document
      .getElementById(
        "listingGrid"
      );


  const status =
    document
      .getElementById(
        "status"
      );


  grid.innerHTML = "";


  if (
    !Array.isArray(
      listings
    )
  ) {

    status.style.display =
      "block";


    status.className =
      "error";


    status.innerHTML =
      "❌ รูปแบบข้อมูลจาก API ไม่ถูกต้อง";


    return;
  }



  if (
    listings.length === 0
  ) {

    status.style.display =
      "block";


    status.className = "";


    status.innerHTML =
      "ไม่พบประกาศ";


    return;
  }



  status.style.display =
    "none";



  listings.forEach(
    function(item) {


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "card";



      let petTags = "";



      if (
        item.pet_dog === true
      ) {

        petTags += `

          <span class="pet-tag">
            🐶 สุนัข
          </span>

        `;

      }



      if (
        item.pet_cat === true
      ) {

        petTags += `

          <span class="pet-tag">
            🐱 แมว
          </span>

        `;

      }



      const details = [];



      if (
        item.bedrooms !== null &&
        item.bedrooms !== undefined
      ) {

        details.push(
          `${item.bedrooms} ห้องนอน`
        );

      }



      if (
        item.bathrooms !== null &&
        item.bathrooms !== undefined
      ) {

        details.push(
          `${item.bathrooms} ห้องน้ำ`
        );

      }



      if (
        item.size_sqm !== null &&
        item.size_sqm !== undefined
      ) {

        details.push(
          `${item.size_sqm} ตร.ม.`
        );

      }



      const detailText =
        details.join(" • ");



      card.innerHTML = `

        <div class="card-image">
          🏢
        </div>


        <div class="card-content">


          <h3 class="card-title">

            ${escapeHTML(
              item.condo_name ||
              "ไม่ระบุชื่อ"
            )}

          </h3>


          <div class="location">

            📍 ${escapeHTML(
              item.location ||
              "ไม่ระบุทำเล"
            )}

          </div>


          <div class="pet-tags">

            ${petTags}

          </div>


          ${
            detailText
              ? `

                <div class="details">

                  ${escapeHTML(
                    detailText
                  )}

                </div>

              `
              : ""
          }


          <div class="price">

            ฿${formatPrice(
              item.price
            )} / เดือน

          </div>


          <a
            href="/condo.html?id=${encodeURIComponent(
              item.id || ""
            )}"
            class="detail-btn"
          >

            ดูรายละเอียด

          </a>


        </div>

      `;



      grid.appendChild(
        card
      );

    }
  );

}



async function loadListings() {

  const status =
    document
      .getElementById(
        "status"
      );


  status.style.display =
    "block";


  status.className = "";


  status.innerHTML =
    "กำลังโหลดประกาศ...";


  try {


    const response =
      await fetch(
        "/api/listings",
        {

          method:
            "GET",

          cache:
            "no-store",

          headers: {

            "Accept":
              "application/json"

          }

        }
      );



    const text =
      await response.text();



    if (
      !response.ok
    ) {

      throw new Error(
        `HTTP ${response.status}: ${text}`
      );

    }



    let data;



    try {

      data =
        JSON.parse(
          text
        );

    }

    catch {

      throw new Error(
        "API ไม่ได้ส่งข้อมูล JSON กลับมา"
      );

    }



    console.log(
      "ข้อมูลจาก Supabase:",
      data
    );



    allListings =
      data;



    renderListings(
      allListings
    );



  }

  catch(error) {


    console.error(
      error
    );


    status.style.display =
      "block";


    status.className =
      "error";


    status.innerHTML = `

      ❌ โหลดข้อมูลไม่สำเร็จ

      <br><br>

      ${escapeHTML(
        error.message
      )}

    `;

  }

}



document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function() {


      const keyword =
        this.value
          .trim()
          .toLowerCase();



      if (!keyword) {

        renderListings(
          allListings
        );

        return;

      }



      const filtered =
        allListings.filter(
          function(item) {


            const name =
              String(
                item.condo_name || ""
              )
              .toLowerCase();



            const location =
              String(
                item.location || ""
              )
              .toLowerCase();



            const description =
              String(
                item.description || ""
              )
              .toLowerCase();



            return (

              name.includes(
                keyword
              )

              ||

              location.includes(
                keyword
              )

              ||

              description.includes(
                keyword
              )

            );

          }
        );



      renderListings(
        filtered
      );

    }
  );



loadListings();


</script>


</body>

</html>
