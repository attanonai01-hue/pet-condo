<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Pet Condo</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #f6f6f6;

  color: #222;

}


header {

  background: white;

  padding: 16px 20px;

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  border-bottom:
    1px solid #eee;

  position: sticky;

  top: 0;

  z-index: 10;

}


.logo {

  font-size: 22px;

  font-weight: 700;

  color: #222;

  text-decoration: none;

}


.post-btn {

  background: #111;

  color: white;

  padding:
    11px 15px;

  border-radius: 12px;

  text-decoration: none;

  font-weight: 600;

}


.hero {

  background: white;

  text-align: center;

  padding:
    45px 20px
    35px;

}


.hero h1 {

  margin:
    0 0 10px;

  font-size: 32px;

}


.hero p {

  margin: 0;

  color: #777;

}


.search-wrap {

  max-width: 620px;

  margin:
    24px auto 0;

}


.search-input {

  width: 100%;

  padding: 16px;

  border:
    1px solid #ddd;

  border-radius: 14px;

  font-size: 16px;

}


.filters {

  margin-top: 16px;

}


.filter {

  display: inline-block;

  margin: 4px;

  padding:
    9px 13px;

  background: #f1f1f1;

  border-radius: 999px;

  font-size: 14px;

}


.container {

  max-width: 1000px;

  margin: auto;

  padding:
    26px 16px
    45px;

}


.section-title {

  margin:
    0 0 18px;

  font-size: 24px;

}


#status {

  text-align: center;

  padding: 30px;

  color: #777;

}


.grid {

  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(260px,1fr)
    );

  gap: 18px;

}


.card {

  background: white;

  border-radius: 18px;

  overflow: hidden;

  box-shadow:
    0 2px 14px
    rgba(0,0,0,.07);

}


.card-image {

  width: 100%;

  height: 220px;

  background: #ddd;

  display: flex;

  justify-content: center;

  align-items: center;

  font-size: 60px;

  overflow: hidden;

}


.card-image img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}


.content {

  padding: 18px;

}


.content h3 {

  margin:
    0 0 8px;

  font-size: 20px;

}


.location {

  color: #777;

  margin-bottom: 10px;

}


.tags {

  margin:
    10px 0;

}


.tag {

  display: inline-block;

  background: #f2f2f2;

  border-radius: 10px;

  padding:
    7px 10px;

  margin-right: 5px;

  font-size: 13px;

}


.details {

  color: #666;

  font-size: 14px;

  margin-top: 10px;

}


.price {

  margin-top: 12px;

  font-size: 20px;

  font-weight: 700;

}


.detail-btn {

  display: block;

  margin-top: 16px;

  padding: 12px;

  background: #111;

  color: white;

  text-align: center;

  text-decoration: none;

  border-radius: 12px;

  font-weight: 600;

}


footer {

  text-align: center;

  padding: 35px;

  color: #999;

}

</style>

</head>


<body>


<header>

<a
  href="/"
  class="logo"
>
  🐾 Pet Condo
</a>


<a
  href="/post.html"
  class="post-btn"
>
  + ลงประกาศ
</a>

</header>



<section class="hero">


<h1>
  หาคอนโดที่สัตว์เลี้ยงอยู่ได้
</h1>


<p>
  ค้นหาบ้านที่ใช่ สำหรับคุณและเพื่อนตัวน้อย 🐶🐱
</p>


<div class="search-wrap">

<input
  id="searchInput"
  class="search-input"
  placeholder="ค้นหาคอนโด ทำเล หรือ BTS/MRT"
>

</div>


<div class="filters">

<span class="filter">
  🐶 เลี้ยงสุนัขได้
</span>

<span class="filter">
  🐱 เลี้ยงแมวได้
</span>

<span class="filter">
  🚆 ใกล้ BTS/MRT
</span>

</div>


</section>



<main class="container">


<h2 class="section-title">
  คอนโดแนะนำ
</h2>


<div id="status">
  กำลังโหลดประกาศ...
</div>


<div
  id="listingGrid"
  class="grid"
></div>


</main>



<footer>
  © 2026 Pet Condo
</footer>



<script>


let allListings =
  [];



function escapeHTML(value) {

  return String(value ?? "")

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}



function safeUrl(value) {

  if (!value) {
    return null;
  }


  try {

    const url =
      new URL(value);


    if (
      url.protocol !== "https:" &&
      url.protocol !== "http:"
    ) {
      return null;
    }


    return url.href;

  }

  catch {

    return null;

  }

}



function getImages(
  listing
) {

  const images =
    Array.isArray(
      listing.listing_images
    )
      ? [...listing.listing_images]
      : [];


  images.sort(
    function(a,b) {

      return (
        Number(a.sort_order || 0) -
        Number(b.sort_order || 0)
      );

    }
  );


  const urls =
    images
      .map(
        item =>
          safeUrl(
            item.image_url
          )
      )
      .filter(Boolean);


  const oldCover =
    safeUrl(
      listing.image_url
    );


  if (
    oldCover &&
    !urls.includes(oldCover)
  ) {

    urls.unshift(
      oldCover
    );

  }


  return urls;

}



function renderListings(
  listings
) {

  const grid =
    document.getElementById(
      "listingGrid"
    );


  const status =
    document.getElementById(
      "status"
    );


  grid.innerHTML =
    "";


  if (
    !listings.length
  ) {

    status.style.display =
      "block";

    status.textContent =
      "ไม่พบประกาศ";

    return;

  }


  status.style.display =
    "none";


  listings.forEach(
    function(item) {


      const images =
        getImages(item);


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "card";


      const imageBox =
        document.createElement(
          "div"
        );


      imageBox.className =
        "card-image";


      if (
        images.length
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.src =
          images[0];


        img.alt =
          item.condo_name ||
          "รูปคอนโด";


        img.loading =
          "lazy";


        imageBox.appendChild(
          img
        );

      }

      else {

        imageBox.textContent =
          "🏢";

      }


      card.appendChild(
        imageBox
      );


      const content =
        document.createElement(
          "div"
        );


      content.className =
        "content";


      let tags =
        "";


      if (item.pet_dog) {

        tags += `
          <span class="tag">
            🐶 สุนัข
          </span>
        `;

      }


      if (item.pet_cat) {

        tags += `
          <span class="tag">
            🐱 แมว
          </span>
        `;

      }


      const details =
        [];


      if (
        item.bedrooms != null
      ) {

        details.push(
          `${item.bedrooms} ห้องนอน`
        );

      }


      if (
        item.bathrooms != null
      ) {

        details.push(
          `${item.bathrooms} ห้องน้ำ`
        );

      }


      if (
        item.size_sqm != null
      ) {

        details.push(
          `${item.size_sqm} ตร.ม.`
        );

      }


      content.innerHTML = `

        <h3>
          ${escapeHTML(
            item.condo_name
          )}
        </h3>

        <div class="location">
          📍 ${escapeHTML(
            item.location
          )}
        </div>

        <div class="tags">
          ${tags}
        </div>

        <div class="details">
          ${escapeHTML(
            details.join(" • ")
          )}
        </div>

        <div class="price">

          ฿${Number(
            item.price || 0
          ).toLocaleString(
            "th-TH"
          )} / เดือน

        </div>

        <a
          class="detail-btn"
          href="/condo.html?id=${encodeURIComponent(item.id)}"
        >
          ดูรายละเอียด
        </a>

      `;


      card.appendChild(
        content
      );


      grid.appendChild(
        card
      );

    }
  );

}



async function loadListings() {

  const status =
    document.getElementById(
      "status"
    );


  try {


    const response =
      await fetch(
        "/api/listings",
        {
          cache:
            "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "โหลดข้อมูลไม่สำเร็จ"
      );

    }


    allListings =
      await response.json();


    renderListings(
      allListings
    );


  }

  catch(error) {


    status.style.display =
      "block";


    status.textContent =
      "❌ " +
      error.message;


  }

}



document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function() {


      const keyword =
        this.value
          .trim()
          .toLowerCase();


      const result =
        allListings.filter(
          item =>

            String(
              item.condo_name || ""
            )
            .toLowerCase()
            .includes(keyword)

            ||

            String(
              item.location || ""
            )
            .toLowerCase()
            .includes(keyword)

        );


      renderListings(
        result
      );

    }
  );



loadListings();


</script>


</body>
</html>
