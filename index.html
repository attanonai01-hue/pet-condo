<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pet Condo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f6f6;
      color: #222;
    }

    header {
      background: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .post-btn {
      background: #111;
      color: white;
      text-decoration: none;
      padding: 11px 15px;
      border-radius: 12px;
    }

    .hero {
      background: white;
      text-align: center;
      padding: 45px 20px 35px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .hero p {
      color: #777;
    }

    .search {
      width: 100%;
      max-width: 600px;
      padding: 16px;
      margin-top: 20px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
    }

    .filters {
      margin-top: 15px;
    }

    .filter {
      display: inline-block;
      padding: 9px 13px;
      margin: 4px;
      background: #f1f1f1;
      border-radius: 20px;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 25px 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
    }

    .image {
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 60px;
      background: #e9e9e9;
    }

    .content {
      padding: 18px;
    }

    .content h3 {
      margin: 0 0 8px;
    }

    .location {
      color: #777;
      margin-bottom: 12px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
    }

    .detail {
      display: block;
      margin-top: 15px;
      background: #111;
      color: white;
      padding: 12px;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
    }

    #status {
      padding: 25px;
      text-align: center;
      color: #777;
    }

    .error {
      color: #c62828 !important;
      background: #ffebee;
      border-radius: 12px;
      word-break: break-word;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #999;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🐾 Pet Condo</div>

  <a class="post-btn" href="#">
    + ลงประกาศ
  </a>
</header>


<section class="hero">

  <h1>หาคอนโดที่สัตว์เลี้ยงอยู่ได้</h1>

  <p>
    ค้นหาบ้านที่ใช่ สำหรับคุณและเพื่อนตัวน้อย 🐶🐱
  </p>

  <input
    id="search"
    class="search"
    placeholder="ค้นหาคอนโด หรือทำเล"
  >

  <div class="filters">
    <span class="filter">🐶 เลี้ยงสุนัขได้</span>
    <span class="filter">🐱 เลี้ยงแมวได้</span>
    <span class="filter">🚆 ใกล้ BTS/MRT</span>
  </div>

</section>


<main class="container">

  <h2>คอนโดแนะนำ</h2>

  <div id="status">
    กำลังเชื่อมต่อ Supabase...
  </div>

  <div id="grid" class="grid"></div>

</main>


<footer>
  © 2026 Pet Condo
</footer>


<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://bttmrtsfbuuaajpxxadg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_LYAOus5geJw0WXkhOycJUQ_n0XYPgre";


const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


let listings = [];


async function loadListings() {

  const status =
    document.getElementById("status");


  status.className = "";
  status.innerHTML = "กำลังโหลดประกาศ...";


  try {

    const { data, error } = await db
      .from("listings")
      .select("*");


    if (error) {
      throw error;
    }


    listings = data || [];


    console.log(
      "ข้อมูลจาก Supabase:",
      listings
    );


    renderListings(listings);

  }

  catch (error) {

    console.error(
      "Supabase Error:",
      error
    );


    status.className = "error";

    status.innerHTML =
      `
      ❌ เชื่อมต่อ Supabase ไม่สำเร็จ
      <br><br>
      ${error.message || error}
      `;

  }

}



function renderListings(data) {

  const grid =
    document.getElementById("grid");

  const status =
    document.getElementById("status");


  grid.innerHTML = "";


  if (!data || data.length === 0) {

    status.style.display = "block";

    status.innerHTML =
      "เชื่อมต่อ Database สำเร็จ ✅<br>แต่ยังไม่มีข้อมูลใน listings";

    return;
  }


  status.style.display = "none";


  data.forEach(item => {

    const card =
      document.createElement("div");

    card.className = "card";


    const price =
      Number(item.price || 0)
      .toLocaleString("th-TH");


    card.innerHTML = `

      <div class="image">
        🏢
      </div>

      <div class="content">

        <h3>
          ${escapeHTML(item.condo_name || "ไม่ระบุชื่อ")}
        </h3>

        <div class="location">
          📍 ${escapeHTML(item.location || "ไม่ระบุทำเล")}
        </div>

        <div class="price">
          ฿${price} / เดือน
        </div>

        <a
          class="detail"
          href="condo.html?id=${encodeURIComponent(item.id || "")}"
        >
          ดูรายละเอียด
        </a>

      </div>

    `;


    grid.appendChild(card);

  });

}



function escapeHTML(value) {

  return String(value)

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}



document
  .getElementById("search")
  .addEventListener(
    "input",
    function () {

      const keyword =
        this.value
        .trim()
        .toLowerCase();


      const result =
        listings.filter(item => {

          const name =
            String(item.condo_name || "")
            .toLowerCase();

          const location =
            String(item.location || "")
            .toLowerCase();


          return (
            name.includes(keyword) ||
            location.includes(keyword)
          );

        });


      renderListings(result);

    }
  );


loadListings();

</script>

</body>
</html>
