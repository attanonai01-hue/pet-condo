<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pet Condo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
    }

    .post-button {
      background: #111;
      color: white;
      padding: 11px 15px;
      border-radius: 12px;
      text-decoration: none;
    }

    .hero {
      background: white;
      text-align: center;
      padding: 45px 20px 35px;
    }

    .hero h1 {
      font-size: 32px;
      margin: 0 0 10px;
    }

    .hero p {
      color: #777;
    }

    .search-box {
      max-width: 600px;
      margin: 25px auto 0;
    }

    .search-box input {
      width: 100%;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
    }

    .filters {
      margin-top: 15px;
    }

    .filter {
      display: inline-block;
      background: #f2f2f2;
      padding: 9px 14px;
      margin: 4px;
      border-radius: 20px;
      font-size: 14px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
    }

    .card-image {
      height: 180px;
      background: linear-gradient(135deg, #ddd, #bbb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .card-content {
      padding: 17px;
    }

    .card h3 {
      margin: 0 0 8px;
    }

    .location {
      color: #777;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
      margin-top: 12px;
    }

    .pet-tags {
      margin-top: 12px;
    }

    .pet-tag {
      display: inline-block;
      padding: 7px 10px;
      background: #f2f2f2;
      border-radius: 9px;
      margin-right: 5px;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .detail-button {
      display: block;
      text-align: center;
      margin-top: 15px;
      padding: 12px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 11px;
    }

    .status {
      text-align: center;
      padding: 35px;
      color: #777;
    }

    footer {
      text-align: center;
      color: #999;
      padding: 30px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🐾 Pet Condo</div>
  <a href="#" class="post-button">+ ลงประกาศ</a>
</header>

<section class="hero">

  <h1>หาคอนโดที่สัตว์เลี้ยงอยู่ได้</h1>

  <p>ค้นหาบ้านที่ใช่ สำหรับคุณและเพื่อนตัวน้อย 🐶🐱</p>

  <div class="search-box">
    <input
      id="searchInput"
      type="text"
      placeholder="ค้นหาคอนโด ทำเล หรือ BTS/MRT"
    >
  </div>

  <div class="filters">
    <span class="filter">🐶 เลี้ยงสุนัขได้</span>
    <span class="filter">🐱 เลี้ยงแมวได้</span>
    <span class="filter">🚆 ใกล้ BTS/MRT</span>
  </div>

</section>

<div class="container">

  <h2>คอนโดแนะนำ</h2>

  <div id="status" class="status">
    กำลังโหลดประกาศ...
  </div>

  <div id="listingGrid" class="grid"></div>

</div>

<footer>
  © 2026 Pet Condo
</footer>

<script>

const SUPABASE_URL =
  "https://bttmrtsfbuuaajpxxadg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LYAOus5geJw0WXkhOycJUQ_n0XYPgre";

let allListings = [];


/* โหลดประกาศจาก Supabase */

async function loadListings() {

  const status =
    document.getElementById("status");

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/listings?select=*`,
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY
        }
      }
    );

    const responseText =
      await response.text();


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}: ${responseText}`
      );

    }


    const data =
      JSON.parse(responseText);


    allListings = data;

    showListings(data);

  }

  catch (error) {

    console.error(error);

    status.style.display = "block";

    status.innerHTML =
      "❌ โหลดประกาศไม่สำเร็จ<br><small>" +
      error.message +
      "</small>";

  }

}


/* แสดงประกาศ */

function showListings(listings) {

  const grid =
    document.getElementById("listingGrid");

  const status =
    document.getElementById("status");


  grid.innerHTML = "";


  if (!listings || listings.length === 0) {

    status.style.display = "block";
    status.textContent = "ยังไม่มีประกาศ";

    return;

  }


  status.style.display = "none";


  listings.forEach(listing => {

    const card =
      document.createElement("div");

    card.className = "card";


    const price =
      Number(listing.price || 0)
      .toLocaleString("th-TH");


    let petTags = "";


    if (listing.pet_dog) {

      petTags +=
        `<span class="pet-tag">
          🐶 สุนัข
        </span>`;

    }


    if (listing.pet_cat) {

      petTags +=
        `<span class="pet-tag">
          🐱 แมว
        </span>`;

    }


    card.innerHTML = `

      <div class="card-image">
        🏢
      </div>

      <div class="card-content">

        <h3>
          ${listing.condo_name || "ไม่ระบุชื่อ"}
        </h3>

        <div class="location">
          📍 ${listing.location || "ไม่ระบุทำเล"}
        </div>

        <div class="price">
          ฿${price} / เดือน
        </div>

        <div class="pet-tags">
          ${petTags}
        </div>

        <a
          href="condo.html?id=${listing.id}"
          class="detail-button"
        >
          ดูรายละเอียด
        </a>

      </div>

    `;


    grid.appendChild(card);

  });

}


/* Search */

document
.getElementById("searchInput")
.addEventListener(
  "input",
  function () {

    const keyword =
      this.value
      .toLowerCase()
      .trim();


    const filtered =
      allListings.filter(
        listing => {

          const condo =
            String(listing.condo_name || "")
            .toLowerCase();

          const location =
            String(listing.location || "")
            .toLowerCase();


          return (
            condo.includes(keyword) ||
            location.includes(keyword)
          );

        }
      );


    showListings(filtered);

  }
);


/* เริ่มโหลด */

loadListings();

</script>

</body>
</html>
