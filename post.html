<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ลงประกาศ | Pet Condo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f6f6f6;
  color: #222;
}

header {
  background: white;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #eee;
}

.logo {
  font-size: 22px;
  font-weight: 700;
  color: #222;
  text-decoration: none;
}

.account-link {
  color: #222;
  text-decoration: none;
  font-weight: 600;
}

.container {
  width: 100%;
  max-width: 700px;
  margin: auto;
  padding: 30px 18px 60px;
}

h1 {
  margin: 0 0 8px;
  font-size: 31px;
}

.subtitle {
  color: #777;
  line-height: 1.6;
  margin-bottom: 25px;
}

.user-info {
  display: none;
  background: #ecfdf3;
  color: #067647;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 20px;
  word-break: break-word;
}

.form-card {
  display: none;
  background: white;
  border-radius: 20px;
  padding: 23px;
  box-shadow: 0 2px 15px rgba(0,0,0,.06);
}

.field {
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
}

input,
textarea {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 13px;
  padding: 14px;
  font-size: 16px;
  font-family: inherit;
  background: white;
}

textarea {
  min-height: 130px;
  resize: vertical;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.image-upload {
  border: 2px dashed #ccc;
  border-radius: 16px;
  padding: 18px;
  background: #fafafa;
}

.image-upload input {
  border: 0;
  padding: 5px 0;
  background: transparent;
}

.image-info {
  color: #777;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 8px;
}

.preview-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin-top: 15px;
}

.preview-item {
  position: relative;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border-radius: 12px;
  background: #eee;
}

.preview-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.cover-label {
  position: absolute;
  top: 6px;
  left: 6px;
  padding: 4px 7px;
  border-radius: 20px;
  background: white;
  font-size: 10px;
  font-weight: 700;
}

.remove-image {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.75);
  color: white;
  font-size: 17px;
}

.pet-box {
  background: #f7f7f7;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 20px;
}

.pet-option {
  display: flex;
  align-items: center;
  margin: 12px 0;
  font-weight: 400;
}

.pet-option input {
  width: 21px;
  height: 21px;
  margin-right: 10px;
}

.submit-button {
  width: 100%;
  border: 0;
  background: #111;
  color: white;
  padding: 16px;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 700;
}

.submit-button:disabled {
  opacity: .5;
}

#message {
  display: none;
  padding: 15px;
  margin-bottom: 20px;
  border-radius: 13px;
  line-height: 1.5;
  word-break: break-word;
}

#message.success {
  display: block;
  background: #ecfdf3;
  color: #067647;
}

#message.error {
  display: block;
  background: #fff0ee;
  color: #b42318;
}

#authRequired {
  display: none;
  background: white;
  border-radius: 20px;
  padding: 30px;
  text-align: center;
}

.login-button {
  display: block;
  margin-top: 20px;
  background: #111;
  color: white;
  padding: 15px;
  border-radius: 13px;
  text-decoration: none;
  font-weight: 700;
}

#loading {
  text-align: center;
  padding: 60px 20px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <a href="/" class="logo">
    🐾 Pet Condo
  </a>

  <a href="/auth.html" class="account-link">
    บัญชีของฉัน
  </a>
</header>

<main class="container">

<h1>ลงประกาศคอนโด</h1>

<div class="subtitle">
  เฉพาะสมาชิกที่ Login และยืนยัน Email แล้วเท่านั้น
</div>

<div id="loading">
  กำลังตรวจสอบบัญชี...
</div>

<div id="message"></div>

<div id="userInfo" class="user-info"></div>

<div id="authRequired">

  <h2>กรุณาเข้าสู่ระบบ</h2>

  <p>
    คุณต้อง Login และยืนยัน Email ก่อนลงประกาศ
  </p>

  <a
    href="/auth.html"
    class="login-button"
  >
    เข้าสู่ระบบ
  </a>

</div>

<div
  id="formCard"
  class="form-card"
>

<form id="listingForm">

<div class="field">

<label>
  รูปคอนโด *
</label>

<div class="image-upload">

<input
  id="imageFiles"
  type="file"
  accept="image/jpeg,image/png,image/webp"
  multiple
  required
>

<div class="image-info">
  สูงสุด 10 รูป • รูปละไม่เกิน 10 MB<br>
  รองรับ JPG, PNG และ WEBP<br>
  รูปแรกจะเป็นรูปหน้าปก
</div>

<div
  id="previewGrid"
  class="preview-grid"
></div>

</div>
</div>

<div class="field">
<label>ชื่อคอนโด *</label>

<input
  id="condoName"
  maxlength="120"
  required
>
</div>

<div class="field">
<label>ทำเล *</label>

<input
  id="location"
  maxlength="200"
  required
>
</div>

<div class="field">
<label>ค่าเช่า / เดือน *</label>

<input
  id="price"
  type="number"
  min="1"
  max="10000000"
  required
>
</div>

<div class="row">

<div class="field">
<label>ห้องนอน</label>

<input
  id="bedrooms"
  type="number"
  min="0"
  max="20"
>
</div>

<div class="field">
<label>ห้องน้ำ</label>

<input
  id="bathrooms"
  type="number"
  min="0"
  max="20"
>
</div>

</div>

<div class="row">

<div class="field">
<label>ขนาด ตร.ม.</label>

<input
  id="size"
  type="number"
  min="0"
  max="10000"
  step="0.01"
>
</div>

<div class="field">
<label>ชั้น</label>

<input
  id="floor"
  type="number"
  min="-10"
  max="300"
>
</div>

</div>

<div class="pet-box">

<strong>
  สัตว์เลี้ยงที่อนุญาต
</strong>

<label class="pet-option">
<input
  id="petDog"
  type="checkbox"
>
🐶 เลี้ยงสุนัขได้
</label>

<label class="pet-option">
<input
  id="petCat"
  type="checkbox"
>
🐱 เลี้ยงแมวได้
</label>

</div>

<div class="field">
<label>รายละเอียด</label>

<textarea
  id="description"
  maxlength="5000"
></textarea>
</div>

<div class="field">
<label>ช่องทางติดต่อ</label>

<input
  id="contact"
  maxlength="300"
  placeholder="เช่น LINE: petcondo"
>
</div>

<button
  id="submitButton"
  class="submit-button"
  type="submit"
>
  ลงประกาศ
</button>

</form>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://bttmrtsfbuuaajpxxadg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LYAOus5geJw0WXkhOycJUQ_n0XYPgre";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        flowType: "pkce"
      }
    }
  );

let currentUser = null;

let selectedFiles = [];

let uploadedPaths = [];


/* ===============================
   MESSAGE
=============================== */

function showMessage(
  text,
  type
) {
  const box =
    document.getElementById(
      "message"
    );

  box.className =
    type;

  box.textContent =
    text;

  box.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}


/* ===============================
   SESSION
=============================== */

async function getSession() {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();

  if (
    error ||
    !data.session
  ) {
    return null;
  }

  return data.session;
}


/* ===============================
   AUTH CHECK
=============================== */

async function initialize() {

  const loading =
    document.getElementById(
      "loading"
    );

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getUser();

    if (
      error ||
      !data.user
    ) {
      throw new Error(
        "NOT_LOGGED_IN"
      );
    }

    currentUser =
      data.user;

    if (
      !currentUser.email_confirmed_at
    ) {
      throw new Error(
        "EMAIL_NOT_VERIFIED"
      );
    }

    loading.style.display =
      "none";

    const userInfo =
      document.getElementById(
        "userInfo"
      );

    userInfo.style.display =
      "block";

    userInfo.textContent =
      `✓ เข้าสู่ระบบแล้ว: ${currentUser.email}`;

    document
      .getElementById(
        "formCard"
      )
      .style.display =
      "block";

  }

  catch {

    loading.style.display =
      "none";

    document
      .getElementById(
        "authRequired"
      )
      .style.display =
      "block";
  }
}


/* ===============================
   NUMBER
=============================== */

function getNumberOrNull(id) {

  const value =
    document
      .getElementById(id)
      .value
      .trim();

  return (
    value === ""
      ? null
      : Number(value)
  );
}


/* ===============================
   FILE SELECT
=============================== */

document
  .getElementById(
    "imageFiles"
  )
  .addEventListener(
    "change",
    function() {

      const files =
        Array.from(
          this.files
        );

      if (
        files.length > 10
      ) {

        showMessage(
          "เลือกได้สูงสุด 10 รูป",
          "error"
        );

        this.value = "";

        selectedFiles = [];

        renderPreviews();

        return;
      }

      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];

      for (
        const file
        of files
      ) {

        if (
          !allowedTypes.includes(
            file.type
          )
        ) {

          showMessage(
            "รองรับเฉพาะ JPG, PNG และ WEBP",
            "error"
          );

          this.value = "";

          selectedFiles = [];

          renderPreviews();

          return;
        }

        if (
          file.size >
          10 * 1024 * 1024
        ) {

          showMessage(
            `${file.name} มีขนาดเกิน 10 MB`,
            "error"
          );

          this.value = "";

          selectedFiles = [];

          renderPreviews();

          return;
        }
      }

      selectedFiles =
        files;

      renderPreviews();
    }
  );


function renderPreviews() {

  const grid =
    document.getElementById(
      "previewGrid"
    );

  grid.innerHTML =
    "";

  selectedFiles.forEach(
    function(
      file,
      index
    ) {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "preview-item";

      const img =
        document.createElement(
          "img"
        );

      img.src =
        URL.createObjectURL(
          file
        );

      item.appendChild(
        img
      );

      if (
        index === 0
      ) {

        const label =
          document.createElement(
            "div"
          );

        label.className =
          "cover-label";

        label.textContent =
          "หน้าปก";

        item.appendChild(
          label
        );
      }

      const remove =
        document.createElement(
          "button"
        );

      remove.type =
        "button";

      remove.className =
        "remove-image";

      remove.textContent =
        "×";

      remove.onclick =
        function() {

          selectedFiles.splice(
            index,
            1
          );

          renderPreviews();
        };

      item.appendChild(
        remove
      );

      grid.appendChild(
        item
      );
    }
  );
}


/* ===================================
   ขอ SIGNED UPLOAD TOKEN จาก SERVER
=================================== */

async function requestUploadToken(
  file
) {

  const session =
    await getSession();

  if (!session) {

    throw new Error(
      "Session หมดอายุ กรุณา Login ใหม่"
    );
  }

  const response =
    await fetch(
      "/api/upload-url",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json",

          Authorization:
            `Bearer ${session.access_token}`
        },

        body:
          JSON.stringify({
            content_type:
              file.type,

            file_size:
              file.size
          })
      }
    );

  let result;

  try {

    result =
      await response.json();

  }

  catch {

    throw new Error(
      "Server ตอบกลับไม่ถูกต้อง"
    );
  }

  if (
    !response.ok
  ) {

    throw new Error(
      result.error ||
      "ขอสิทธิ์อัปโหลดไม่สำเร็จ"
    );
  }

  if (
    !result.path ||
    !result.token
  ) {

    throw new Error(
      "ไม่พบ Upload Token"
    );
  }

  return result;
}


/* ===================================
   SIGNED UPLOAD
=================================== */

async function uploadImage(
  file
) {

  /*
    1. Browser ขอ Token จาก Vercel API
  */

  const signed =
    await requestUploadToken(
      file
    );


  /*
    2. ใช้ Token อัปโหลดไป Supabase

    ไม่ได้ใช้ INSERT policy ของ User
    สำหรับการ upload นี้
  */

  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from(
        "listing-images"
      )
      .uploadToSignedUrl(
        signed.path,
        signed.token,
        file,
        {
          cacheControl:
            "31536000",

          contentType:
            file.type
        }
      );


  if (error) {

    console.error(
      "Signed upload error:",
      error
    );

    throw new Error(
      "อัปโหลดรูปไม่สำเร็จ: " +
      error.message
    );
  }


  uploadedPaths.push(
    signed.path
  );


  /*
    Bucket เป็น Public
    จึงสร้าง Public URL ได้
  */

  const {
    data: publicData
  } =
    supabaseClient
      .storage
      .from(
        "listing-images"
      )
      .getPublicUrl(
        signed.path
      );


  return (
    publicData.publicUrl
  );
}


/* ===============================
   CLEANUP
=============================== */

async function cleanupUploads() {

  if (
    uploadedPaths.length === 0
  ) {
    return;
  }

  try {

    await supabaseClient
      .storage
      .from(
        "listing-images"
      )
      .remove(
        uploadedPaths
      );

  }

  catch(error) {

    console.error(
      "Cleanup error:",
      error
    );
  }

  uploadedPaths =
    [];
}


/* ===============================
   SUBMIT
=============================== */

document
  .getElementById(
    "listingForm"
  )
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const button =
        document.getElementById(
          "submitButton"
        );

      if (
        selectedFiles.length === 0
      ) {

        showMessage(
          "กรุณาเลือกรูปอย่างน้อย 1 รูป",
          "error"
        );

        return;
      }

      button.disabled =
        true;

      uploadedPaths =
        [];

      try {

        const {
          data: userData,
          error: userError
        } =
          await supabaseClient
            .auth
            .getUser();

        if (
          userError ||
          !userData.user
        ) {

          throw new Error(
            "Session หมดอายุ กรุณา Login ใหม่"
          );
        }

        currentUser =
          userData.user;


        /* =========================
           UPLOAD รูป
        ========================= */

        const imageUrls =
          [];

        for (
          let i = 0;
          i < selectedFiles.length;
          i++
        ) {

          button.textContent =
            `กำลังอัปโหลดรูป ${i + 1}/${selectedFiles.length}...`;

          const url =
            await uploadImage(
              selectedFiles[i]
            );

          imageUrls.push(
            url
          );
        }


        /* =========================
           SESSION ล่าสุด
        ========================= */

        const session =
          await getSession();

        if (!session) {

          throw new Error(
            "Session หมดอายุ กรุณา Login ใหม่"
          );
        }


        /* =========================
           PAYLOAD
        ========================= */

        const payload = {

          condo_name:
            document
              .getElementById(
                "condoName"
              )
              .value
              .trim(),

          location:
            document
              .getElementById(
                "location"
              )
              .value
              .trim(),

          price:
            Number(
              document
                .getElementById(
                  "price"
                )
                .value
            ),

          bedrooms:
            getNumberOrNull(
              "bedrooms"
            ),

          bathrooms:
            getNumberOrNull(
              "bathrooms"
            ),

          size_sqm:
            getNumberOrNull(
              "size"
            ),

          floor:
            getNumberOrNull(
              "floor"
            ),

          pet_dog:
            document
              .getElementById(
                "petDog"
              )
              .checked,

          pet_cat:
            document
              .getElementById(
                "petCat"
              )
              .checked,

          description:
            document
              .getElementById(
                "description"
              )
              .value
              .trim(),

          contact:
            document
              .getElementById(
                "contact"
              )
              .value
              .trim(),

          image_urls:
            imageUrls
        };


        /* =========================
           CREATE LISTING
        ========================= */

        button.textContent =
          "กำลังลงประกาศ...";

        const response =
          await fetch(
            "/api/listings",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                Authorization:
                  `Bearer ${session.access_token}`
              },

              body:
                JSON.stringify(
                  payload
                )
            }
          );


        const result =
          await response.json();


        if (
          !response.ok
        ) {

          throw new Error(
            result.error ||
            "ลงประกาศไม่สำเร็จ"
          );
        }


        /*
          สำเร็จ
          ไม่ต้อง Cleanup
        */

        uploadedPaths =
          [];


        showMessage(
          "✅ ลงประกาศสำเร็จ",
          "success"
        );


        setTimeout(
          function() {

            window.location.href =
              `/condo.html?id=${encodeURIComponent(
                result.listing_id
              )}`;

          },
          800
        );

      }

      catch(error) {

        console.error(
          error
        );


        await cleanupUploads();


        showMessage(
          "❌ " +
          error.message,
          "error"
        );


        button.disabled =
          false;


        button.textContent =
          "ลงประกาศ";
      }
    }
  );


initialize();

</script>

</body>
</html>
