<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ลงประกาศ | Pet Condo</title>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #f6f6f6;

  color: #222;
}


header {

  background: white;

  padding: 16px 20px;

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  border-bottom:
    1px solid #eee;

}


.logo {

  font-size: 22px;

  font-weight: 700;

  color: #222;

  text-decoration: none;

}


.back {

  color: #222;

  text-decoration: none;

  font-weight: 600;

}


.container {

  width: 100%;

  max-width: 700px;

  margin: auto;

  padding:
    30px 18px
    60px;

}


h1 {

  margin:
    0 0 8px;

  font-size: 31px;

}


.subtitle {

  color: #777;

  line-height: 1.6;

  margin-bottom: 25px;

}


.form-card {

  background: white;

  border-radius: 20px;

  padding: 23px;

  box-shadow:
    0 2px 15px
    rgba(0,0,0,.06);

}


.field {

  margin-bottom: 20px;

}


label {

  display: block;

  margin-bottom: 8px;

  font-weight: 600;

}


input,
textarea {

  width: 100%;

  border:
    1px solid #ddd;

  border-radius: 13px;

  padding: 14px;

  font-size: 16px;

  font-family: inherit;

  outline: none;

  background: white;

}


input:focus,
textarea:focus {

  border-color: #888;

}


textarea {

  min-height: 130px;

  resize: vertical;

}


.row {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 14px;

}


/* IMAGE */

.image-upload {

  border:
    2px dashed #ccc;

  border-radius: 16px;

  padding: 18px;

  background: #fafafa;

}


.image-upload input {

  border: 0;

  padding: 5px 0;

  background:
    transparent;

}


.image-info {

  color: #777;

  font-size: 13px;

  line-height: 1.5;

  margin-top: 8px;

}


.preview-grid {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 8px;

  margin-top: 15px;

}


.preview-item {

  position: relative;

  aspect-ratio: 1 / 1;

  border-radius: 12px;

  overflow: hidden;

  background: #eee;

}


.preview-item img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}


.preview-number {

  position: absolute;

  left: 6px;

  bottom: 6px;

  background:
    rgba(0,0,0,.7);

  color: white;

  border-radius: 20px;

  padding: 4px 7px;

  font-size: 11px;

}


.preview-cover {

  position: absolute;

  top: 6px;

  left: 6px;

  background: white;

  color: #111;

  border-radius: 20px;

  padding: 4px 7px;

  font-size: 10px;

  font-weight: 700;

}


.remove-image {

  position: absolute;

  top: 5px;

  right: 5px;

  width: 28px;

  height: 28px;

  padding: 0;

  border-radius: 50%;

  background:
    rgba(0,0,0,.75);

  color: white;

  border: 0;

  font-size: 15px;

}


/* PET */

.pet-box {

  background: #f7f7f7;

  padding: 16px;

  border-radius: 14px;

  margin-bottom: 20px;

}


.pet-option {

  display: flex;

  align-items: center;

  margin:
    12px 0;

  font-weight: 400;

}


.pet-option input {

  width: 21px;

  height: 21px;

  margin-right: 10px;

}


/* BUTTON */

.submit-button {

  width: 100%;

  border: 0;

  background: #111;

  color: white;

  padding: 16px;

  border-radius: 14px;

  font-size: 17px;

  font-weight: 700;

}


.submit-button:disabled {

  opacity: .5;

}


#message {

  display: none;

  margin-bottom: 20px;

  padding: 15px;

  border-radius: 13px;

  line-height: 1.5;

  word-break: break-word;

}


.success {

  display: block !important;

  background: #ecfdf3;

  color: #067647;

}


.error {

  display: block !important;

  background: #fff0ee;

  color: #b42318;

}


.required {

  color: #d92d20;

}


@media (max-width: 600px) {

  .preview-grid {

    grid-template-columns:
      repeat(3, 1fr);

  }

}

</style>

</head>


<body>


<header>

<a
  href="/"
  class="logo"
>
  🐾 Pet Condo
</a>


<a
  href="/"
  class="back"
>
  ← กลับ
</a>

</header>



<main class="container">


<h1>
  ลงประกาศคอนโด
</h1>


<div class="subtitle">

  เพิ่มข้อมูลและรูปคอนโด
  ได้สูงสุด 10 รูป

</div>


<div id="message"></div>



<div class="form-card">


<form id="listingForm">


<div class="field">

<label>

  รูปคอนโด

  <span class="required">
    *
  </span>

</label>


<div class="image-upload">


<input
  id="imageFiles"
  type="file"
  accept="image/*"
  multiple
  required
>


<div class="image-info">

  เลือกได้สูงสุด 10 รูป<br>

  รูปละไม่เกิน 5 MB<br>

  รูปแรกจะเป็นรูปหน้าปก

</div>


<div
  id="previewGrid"
  class="preview-grid"
></div>


</div>

</div>



<div class="field">

<label>
  ชื่อคอนโด *
</label>

<input
  id="condoName"
  required
  placeholder="เช่น Happy Pet Residence"
>

</div>



<div class="field">

<label>
  ทำเล *
</label>

<input
  id="location"
  required
  placeholder="เช่น อ่อนนุช • ใกล้ BTS"
>

</div>



<div class="field">

<label>
  ค่าเช่า / เดือน *
</label>

<input
  id="price"
  type="number"
  min="1"
  required
  placeholder="15000"
>

</div>



<div class="row">


<div class="field">

<label>
  ห้องนอน
</label>

<input
  id="bedrooms"
  type="number"
  min="0"
>

</div>


<div class="field">

<label>
  ห้องน้ำ
</label>

<input
  id="bathrooms"
  type="number"
  min="0"
>

</div>


</div>



<div class="row">


<div class="field">

<label>
  ขนาด ตร.ม.
</label>

<input
  id="size"
  type="number"
  min="0"
  step="0.01"
>

</div>


<div class="field">

<label>
  ชั้น
</label>

<input
  id="floor"
  type="number"
>

</div>


</div>



<div class="pet-box">


<strong>
  สัตว์เลี้ยงที่อนุญาต
</strong>


<label class="pet-option">

<input
  id="petDog"
  type="checkbox"
>

🐶 เลี้ยงสุนัขได้

</label>


<label class="pet-option">

<input
  id="petCat"
  type="checkbox"
>

🐱 เลี้ยงแมวได้

</label>


</div>



<div class="field">

<label>
  รายละเอียด
</label>

<textarea
  id="description"
  placeholder="รายละเอียดคอนโด..."
></textarea>

</div>



<div class="field">

<label>
  ช่องทางติดต่อ
</label>

<input
  id="contact"
  placeholder="เช่น LINE: petcondo"
>

</div>



<button
  id="submitButton"
  class="submit-button"
  type="submit"
>

  ลงประกาศ

</button>


</form>

</div>

</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
  "https://bttmrtsfbuuaajpxxadg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_LYAOus5geJw0WXkhOycJUQ_n0XYPgre";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let selectedFiles =
  [];



function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "message"
    );


  box.className =
    type;


  box.textContent =
    text;


  box.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}



function getNumberOrNull(id) {

  const value =
    document
      .getElementById(id)
      .value
      .trim();


  return value === ""
    ? null
    : Number(value);

}



/* =====================
   FILE SELECT
===================== */

document
  .getElementById(
    "imageFiles"
  )
  .addEventListener(
    "change",
    function() {


      const files =
        Array.from(
          this.files
        );


      if (
        files.length > 10
      ) {

        showMessage(
          "❌ เลือกรูปได้สูงสุด 10 รูป",
          "error"
        );

        this.value =
          "";

        selectedFiles =
          [];

        renderPreviews();

        return;

      }


      for (
        const file of files
      ) {

        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          showMessage(
            "❌ กรุณาเลือกเฉพาะไฟล์รูปภาพ",
            "error"
          );

          return;

        }


        if (
          file.size >
          5 * 1024 * 1024
        ) {

          showMessage(
            `❌ ${file.name} มีขนาดเกิน 5 MB`,
            "error"
          );

          return;

        }

      }


      selectedFiles =
        files;


      renderPreviews();

    }
  );



function renderPreviews() {

  const grid =
    document.getElementById(
      "previewGrid"
    );


  grid.innerHTML =
    "";


  selectedFiles.forEach(
    function(file, index) {


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "preview-item";


      const img =
        document.createElement(
          "img"
        );


      img.src =
        URL.createObjectURL(
          file
        );


      item.appendChild(
        img
      );


      if (index === 0) {

        const cover =
          document.createElement(
            "div"
          );

        cover.className =
          "preview-cover";

        cover.textContent =
          "หน้าปก";

        item.appendChild(
          cover
        );

      }


      const number =
        document.createElement(
          "div"
        );


      number.className =
        "preview-number";


      number.textContent =
        `${index + 1}/${selectedFiles.length}`;


      item.appendChild(
        number
      );


      const remove =
        document.createElement(
          "button"
        );


      remove.type =
        "button";


      remove.className =
        "remove-image";


      remove.textContent =
        "×";


      remove.onclick =
        function() {

          selectedFiles.splice(
            index,
            1
          );

          renderPreviews();

        };


      item.appendChild(
        remove
      );


      grid.appendChild(
        item
      );

    }
  );

}



/* =====================
   UPLOAD ONE IMAGE
===================== */

async function uploadImage(
  file,
  index
) {


  const extensionParts =
    file.name.split(".");


  let extension =
    extensionParts.length > 1
      ? extensionParts.pop()
      : "jpg";


  extension =
    String(extension)
      .toLowerCase()
      .replace(
        /[^a-z0-9]/g,
        ""
      );


  if (!extension) {
    extension = "jpg";
  }


  const fileName =
    `listings/${Date.now()}-${index}-${crypto.randomUUID()}.${extension}`;


  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from(
        "listing-images"
      )
      .upload(
        fileName,
        file,
        {

          cacheControl:
            "3600",

          upsert:
            false,

          contentType:
            file.type

        }
      );


  if (error) {

    throw new Error(
      error.message
    );

  }


  const {
    data: publicData
  } =
    supabaseClient
      .storage
      .from(
        "listing-images"
      )
      .getPublicUrl(
        data.path
      );


  return (
    publicData.publicUrl
  );

}



/* =====================
   SUBMIT
===================== */

document
  .getElementById(
    "listingForm"
  )
  .addEventListener(
    "submit",
    async function(event) {


      event.preventDefault();


      const button =
        document.getElementById(
          "submitButton"
        );


      if (
        selectedFiles.length === 0
      ) {

        showMessage(
          "❌ กรุณาเลือกรูปอย่างน้อย 1 รูป",
          "error"
        );

        return;

      }


      button.disabled =
        true;


      try {


        const uploadedUrls =
          [];


        for (
          let i = 0;
          i < selectedFiles.length;
          i++
        ) {


          button.textContent =
            `กำลังอัปโหลดรูป ${i + 1}/${selectedFiles.length}...`;


          const url =
            await uploadImage(
              selectedFiles[i],
              i
            );


          uploadedUrls.push(
            url
          );

        }



        button.textContent =
          "กำลังลงประกาศ...";


        const payload = {


          condo_name:
            document
              .getElementById(
                "condoName"
              )
              .value
              .trim(),


          location:
            document
              .getElementById(
                "location"
              )
              .value
              .trim(),


          price:
            Number(
              document
                .getElementById(
                  "price"
                )
                .value
            ),


          bedrooms:
            getNumberOrNull(
              "bedrooms"
            ),


          bathrooms:
            getNumberOrNull(
              "bathrooms"
            ),


          size_sqm:
            getNumberOrNull(
              "size"
            ),


          floor:
            getNumberOrNull(
              "floor"
            ),


          pet_dog:
            document
              .getElementById(
                "petDog"
              )
              .checked,


          pet_cat:
            document
              .getElementById(
                "petCat"
              )
              .checked,


          description:
            document
              .getElementById(
                "description"
              )
              .value
              .trim(),


          contact:
            document
              .getElementById(
                "contact"
              )
              .value
              .trim(),


          image_url:
            uploadedUrls[0],


          image_urls:
            uploadedUrls

        };



        const response =
          await fetch(
            "/api/listings",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  payload
                )

            }
          );


        const text =
          await response.text();


        if (!response.ok) {

          let message =
            text;


          try {

            const json =
              JSON.parse(
                text
              );


            message =
              json.error ||
              json.details ||
              text;

          }

          catch {}


          throw new Error(
            message
          );

        }


        showMessage(
          "✅ ลงประกาศและอัปโหลดรูปทั้งหมดสำเร็จ",
          "success"
        );


        setTimeout(
          function() {

            window.location.href =
              "/?new=1";

          },
          1200
        );


      }

      catch(error) {


        console.error(
          error
        );


        showMessage(
          "❌ " +
          error.message,
          "error"
        );


        button.disabled =
          false;


        button.textContent =
          "ลงประกาศ";

      }

    }
  );


</script>


</body>
</html>
