<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>รายละเอียดคอนโด | Pet Condo</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f6f6f6;

      color: #222;
    }


    .hero-image {

      width: 100%;

      height: 360px;

      background:
        linear-gradient(
          135deg,
          #eeeeee,
          #cccccc
        );

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 90px;

      overflow: hidden;

    }


    .hero-image img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

    }


    .container {

      width: 100%;

      max-width: 760px;

      margin: auto;

      padding:
        30px 20px
        50px;

    }


    .back {

      display: inline-block;

      margin-bottom: 22px;

      color: #222;

      text-decoration: none;

      font-weight: 600;

    }


    h1 {

      margin:
        0 0 12px;

      font-size: 36px;

      line-height: 1.2;

    }


    .location {

      color: #777;

      font-size: 18px;

      margin-bottom: 28px;

    }


    .price {

      font-size: 31px;

      font-weight: 700;

      margin-bottom: 20px;

    }


    .tags {

      margin-bottom: 25px;

    }


    .tag {

      display: inline-block;

      background: white;

      padding:
        10px 14px;

      margin-right: 6px;

      margin-bottom: 6px;

      border-radius: 12px;

      font-size: 16px;

    }


    .box {

      background: white;

      border-radius: 20px;

      padding: 25px;

      margin-top: 20px;

    }


    .box h2 {

      margin-top: 0;

      margin-bottom: 20px;

      font-size: 23px;

    }


    .description {

      font-size: 17px;

      line-height: 1.7;

      white-space: pre-line;

    }


    .room-row {

      font-size: 18px;

      margin:
        18px 0;

    }


    .contact-text {

      font-size: 17px;

      line-height: 1.6;

      word-break: break-word;

    }


    .contact-btn {

      display: block;

      background: #111;

      color: white;

      text-decoration: none;

      text-align: center;

      padding: 16px;

      border-radius: 14px;

      margin-top: 25px;

      font-size: 18px;

      font-weight: 600;

    }


    #loading {

      text-align: center;

      padding:
        100px 20px;

      color: #777;

    }


    #error {

      display: none;

      max-width: 700px;

      margin:
        40px auto;

      background: #ffebee;

      color: #b42318;

      padding: 20px;

      border-radius: 14px;

      text-align: center;

    }


    #page {

      display: none;

    }


    @media (max-width: 600px) {

      .hero-image {

        height: 300px;

      }


      h1 {

        font-size: 30px;

      }


      .container {

        padding:
          28px 20px
          45px;

      }


      .box {

        padding: 22px;

      }

    }

  </style>

</head>



<body>



<div id="loading">
  กำลังโหลดข้อมูลคอนโด...
</div>



<div id="error"></div>



<div id="page">


  <div
    id="heroImage"
    class="hero-image"
  >
    🏢
  </div>



  <main class="container">


    <a
      href="/"
      class="back"
    >
      ← กลับหน้าหลัก
    </a>



    <h1 id="condoName"></h1>



    <div
      id="location"
      class="location"
    ></div>



    <div
      id="price"
      class="price"
    ></div>



    <div
      id="petTags"
      class="tags"
    ></div>



    <section class="box">


      <h2>
        รายละเอียด
      </h2>


      <div
        id="description"
        class="description"
      ></div>


    </section>



    <section class="box">


      <h2>
        ข้อมูลห้อง
      </h2>


      <div
        id="bedrooms"
        class="room-row"
      ></div>


      <div
        id="bathrooms"
        class="room-row"
      ></div>


      <div
        id="size"
        class="room-row"
      ></div>


      <div
        id="floor"
        class="room-row"
      ></div>


    </section>



    <section class="box">


      <h2>
        ติดต่อ
      </h2>


      <div
        id="contactText"
        class="contact-text"
      ></div>


      <a
        href="#"
        id="contactButton"
        class="contact-btn"
      >
        ติดต่อผู้ลงประกาศ
      </a>


    </section>


  </main>


</div>



<script>


function escapeHTML(value) {

  return String(value ?? "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



function safeImageUrl(value) {

  if (!value) {
    return null;
  }


  try {

    const url =
      new URL(
        value
      );


    if (
      url.protocol !== "http:" &&
      url.protocol !== "https:"
    ) {

      return null;

    }


    return url.href;

  }

  catch {

    return null;

  }

}



function showImage(
  condo
) {

  const hero =
    document.getElementById(
      "heroImage"
    );


  const imageUrl =
    safeImageUrl(
      condo.image_url
    );


  if (!imageUrl) {

    hero.textContent =
      "🏢";

    return;

  }


  hero.innerHTML =
    "";


  const img =
    document.createElement(
      "img"
    );


  img.src =
    imageUrl;


  img.alt =
    condo.condo_name ||
    "รูปคอนโด";


  img.onerror =
    function() {

      hero.innerHTML =
        "";

      hero.textContent =
        "🏢";

    };


  hero.appendChild(
    img
  );

}



async function loadCondo() {


  const loading =
    document.getElementById(
      "loading"
    );


  const errorBox =
    document.getElementById(
      "error"
    );


  const page =
    document.getElementById(
      "page"
    );


  try {


    const params =
      new URLSearchParams(
        window.location.search
      );


    const condoId =
      params.get(
        "id"
      );


    if (!condoId) {

      throw new Error(
        "ไม่พบ ID ของคอนโด"
      );

    }



    const response =
      await fetch(
        "/api/listings",
        {
          method: "GET",
          cache: "no-store",

          headers: {
            Accept:
              "application/json"
          }
        }
      );



    if (!response.ok) {

      const text =
        await response.text();


      throw new Error(
        `โหลดข้อมูลไม่สำเร็จ HTTP ${response.status}: ${text}`
      );

    }



    const listings =
      await response.json();



    if (
      !Array.isArray(
        listings
      )
    ) {

      throw new Error(
        "ข้อมูลจาก API ไม่ถูกต้อง"
      );

    }



    const condo =
      listings.find(
        function(item) {

          return (
            String(item.id) ===
            String(condoId)
          );

        }
      );



    if (!condo) {

      throw new Error(
        "ไม่พบประกาศนี้ใน Database"
      );

    }



    document.title =
      `${condo.condo_name || "รายละเอียดคอนโด"} | Pet Condo`;



    showImage(
      condo
    );



    document
      .getElementById(
        "condoName"
      )
      .textContent =
      condo.condo_name ||
      "ไม่ระบุชื่อ";



    document
      .getElementById(
        "location"
      )
      .textContent =
      `📍 ${condo.location || "ไม่ระบุทำเล"}`;



    const price =
      Number(
        condo.price || 0
      )
      .toLocaleString(
        "th-TH"
      );



    document
      .getElementById(
        "price"
      )
      .textContent =
      `฿${price} / เดือน`;



    let tags =
      "";



    if (
      condo.pet_dog === true
    ) {

      tags += `

        <span class="tag">
          🐶 เลี้ยงสุนัขได้
        </span>

      `;

    }



    if (
      condo.pet_cat === true
    ) {

      tags += `

        <span class="tag">
          🐱 เลี้ยงแมวได้
        </span>

      `;

    }



    document
      .getElementById(
        "petTags"
      )
      .innerHTML =
      tags;



    document
      .getElementById(
        "description"
      )
      .textContent =
      condo.description ||
      "ไม่มีรายละเอียด";



    document
      .getElementById(
        "bedrooms"
      )
      .textContent =
      `🛏️ ${
        condo.bedrooms ??
        "-"
      } ห้องนอน`;



    document
      .getElementById(
        "bathrooms"
      )
      .textContent =
      `🚿 ${
        condo.bathrooms ??
        "-"
      } ห้องน้ำ`;



    document
      .getElementById(
        "size"
      )
      .textContent =
      `📐 ${
        condo.size_sqm ??
        "-"
      } ตร.ม.`;



    document
      .getElementById(
        "floor"
      )
      .textContent =
      `🏢 ชั้น ${
        condo.floor ??
        "-"
      }`;



    document
      .getElementById(
        "contactText"
      )
      .textContent =
      condo.contact ||
      "ไม่ระบุช่องทางติดต่อ";



    const contactButton =
      document.getElementById(
        "contactButton"
      );



    if (
      condo.contact
    ) {

      contactButton.href =
        `https://www.google.com/search?q=${encodeURIComponent(
          condo.contact
        )}`;

    }

    else {

      contactButton.style.display =
        "none";

    }



    loading.style.display =
      "none";


    page.style.display =
      "block";


  }

  catch(error) {


    console.error(
      error
    );


    loading.style.display =
      "none";


    errorBox.style.display =
      "block";


    errorBox.innerHTML = `

      ❌ ${escapeHTML(
        error.message
      )}

      <br><br>

      <a href="/">
        กลับหน้าหลัก
      </a>

    `;

  }

}



loadCondo();


</script>


</body>

</html>
