<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Pet Condo</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: #f6f6f6;
  color: #222;
}

/* =========================
   GALLERY
========================= */

.gallery {
  position: relative;
  width: 100%;
  background: #ddd;
}

.gallery-track {
  display: flex;
  width: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.gallery-track::-webkit-scrollbar {
  display: none;
}

.slide {
  min-width: 100%;
  width: 100%;
  height: 390px;
  scroll-snap-align: start;
  background: #ddd;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 80px;

  overflow: hidden;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  cursor: pointer;
}

.gallery-button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);

  width: 44px;
  height: 44px;

  border: 0;
  border-radius: 50%;

  background: rgba(255,255,255,.92);

  font-size: 26px;

  z-index: 5;

  cursor: pointer;
}

.prev {
  left: 12px;
}

.next {
  right: 12px;
}

.counter {
  position: absolute;

  right: 15px;
  bottom: 15px;

  background: rgba(0,0,0,.65);

  color: white;

  border-radius: 20px;

  padding: 7px 11px;

  font-size: 13px;
}

/* แตะเพื่อดูรูปใหญ่ */

.expand-hint {
  position: absolute;

  left: 15px;
  bottom: 15px;

  background: rgba(0,0,0,.65);

  color: white;

  padding: 7px 11px;

  border-radius: 20px;

  font-size: 12px;

  pointer-events: none;
}

/* =========================
   THUMBNAILS
========================= */

.thumbnails {
  display: flex;
  gap: 8px;

  padding: 10px;

  overflow-x: auto;

  background: white;
}

.thumb {
  width: 68px;
  height: 60px;

  flex: 0 0 auto;

  border-radius: 8px;

  overflow: hidden;

  border: 2px solid transparent;

  padding: 0;

  background: #ddd;

  cursor: pointer;
}

.thumb.active {
  border-color: #111;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* =========================
   CONTENT
========================= */

.container {
  max-width: 760px;
  margin: auto;
  padding: 30px 20px 50px;
}

.back {
  display: inline-block;
  margin-bottom: 22px;

  color: #222;

  text-decoration: none;

  font-weight: 600;
}

h1 {
  margin: 0 0 12px;
  font-size: 36px;
}

.location {
  color: #777;
  font-size: 18px;
  margin-bottom: 28px;
}

.price {
  font-size: 31px;
  font-weight: 700;
  margin-bottom: 20px;
}

.tags {
  margin-bottom: 25px;
}

.tag {
  display: inline-block;

  background: white;

  padding: 10px 14px;

  margin-right: 6px;
  margin-bottom: 6px;

  border-radius: 12px;

  font-size: 16px;
}

.box {
  background: white;

  border-radius: 20px;

  padding: 25px;

  margin-top: 20px;
}

.box h2 {
  margin-top: 0;
}

.description {
  font-size: 17px;
  line-height: 1.7;
  white-space: pre-line;
}

.room-row {
  font-size: 18px;
  margin: 18px 0;
}

.contact {
  display: block;

  background: #111;

  color: white;

  text-decoration: none;

  text-align: center;

  padding: 16px;

  border-radius: 14px;

  margin-top: 25px;

  font-size: 18px;

  font-weight: 600;
}

#loading {
  text-align: center;
  padding: 100px 20px;
}

#page {
  display: none;
}

#error {
  display: none;

  padding: 40px 20px;

  text-align: center;

  color: #b42318;
}


/* =========================
   FULLSCREEN LIGHTBOX
========================= */

.lightbox {
  display: none;

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  background: rgba(0,0,0,.97);

  z-index: 9999;
}

.lightbox.open {
  display: flex;

  align-items: center;

  justify-content: center;
}

.lightbox-image-wrap {
  width: 100%;
  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;
}

#lightboxImage {
  width: 100%;
  height: 100%;

  object-fit: contain;

  user-select: none;

  -webkit-user-drag: none;
}

.lightbox-close {
  position: absolute;

  top: max(18px, env(safe-area-inset-top));
  right: 18px;

  width: 46px;
  height: 46px;

  border: 0;

  border-radius: 50%;

  background: rgba(255,255,255,.18);

  color: white;

  font-size: 30px;

  z-index: 10002;
}

.lightbox-prev,
.lightbox-next {
  position: absolute;

  top: 50%;

  transform: translateY(-50%);

  width: 48px;
  height: 48px;

  border: 0;

  border-radius: 50%;

  background: rgba(255,255,255,.18);

  color: white;

  font-size: 34px;

  z-index: 10002;
}

.lightbox-prev {
  left: 12px;
}

.lightbox-next {
  right: 12px;
}

.lightbox-counter {
  position: absolute;

  left: 50%;

  transform: translateX(-50%);

  bottom: max(25px, env(safe-area-inset-bottom));

  padding: 8px 14px;

  background: rgba(0,0,0,.65);

  color: white;

  border-radius: 999px;

  font-size: 14px;

  z-index: 10002;
}


/* =========================
   MOBILE
========================= */

@media (max-width:600px) {

  .slide {
    height: 300px;
  }

  .gallery-button {
    width: 38px;
    height: 38px;
  }

  h1 {
    font-size: 30px;
  }

  .lightbox-prev,
  .lightbox-next {
    width: 42px;
    height: 42px;

    font-size: 28px;
  }

}

</style>

</head>


<body>


<div id="loading">
  กำลังโหลดข้อมูล...
</div>


<div id="error"></div>



<div id="page">


<div
  id="gallery"
  class="gallery"
>

<div
  id="galleryTrack"
  class="gallery-track"
></div>


<button
  id="prevButton"
  class="gallery-button prev"
  type="button"
>
  ‹
</button>


<button
  id="nextButton"
  class="gallery-button next"
  type="button"
>
  ›
</button>


<div
  id="counter"
  class="counter"
></div>


<div
  id="expandHint"
  class="expand-hint"
>
  ⛶ แตะเพื่อดูรูปใหญ่
</div>

</div>



<div
  id="thumbnails"
  class="thumbnails"
></div>



<main class="container">


<a
  href="/"
  class="back"
>
  ← กลับหน้าหลัก
</a>


<h1 id="condoName"></h1>


<div
  id="location"
  class="location"
></div>


<div
  id="price"
  class="price"
></div>


<div
  id="petTags"
  class="tags"
></div>



<section class="box">

<h2>
  รายละเอียด
</h2>

<div
  id="description"
  class="description"
></div>

</section>



<section class="box">

<h2>
  ข้อมูลห้อง
</h2>

<div
  id="bedrooms"
  class="room-row"
></div>

<div
  id="bathrooms"
  class="room-row"
></div>

<div
  id="size"
  class="room-row"
></div>

<div
  id="floor"
  class="room-row"
></div>

</section>



<section class="box">

<h2>
  ติดต่อ
</h2>

<div id="contactText"></div>

<a
  href="#"
  id="contactButton"
  class="contact"
>
  ติดต่อผู้ลงประกาศ
</a>

</section>


</main>

</div>


<!-- =========================
     FULLSCREEN IMAGE
========================= -->

<div
  id="lightbox"
  class="lightbox"
>

<button
  id="lightboxClose"
  class="lightbox-close"
  type="button"
>
  ×
</button>


<button
  id="lightboxPrev"
  class="lightbox-prev"
  type="button"
>
  ‹
</button>


<div
  id="lightboxImageWrap"
  class="lightbox-image-wrap"
>

<img
  id="lightboxImage"
  alt="รูปคอนโดขนาดใหญ่"
>

</div>


<button
  id="lightboxNext"
  class="lightbox-next"
  type="button"
>
  ›
</button>


<div
  id="lightboxCounter"
  class="lightbox-counter"
></div>

</div>



<script>


let galleryImages = [];

let currentImage = 0;

let lightboxIndex = 0;



function safeUrl(value) {

  if (!value) {
    return null;
  }


  try {

    const url =
      new URL(value);


    if (
      url.protocol !== "https:" &&
      url.protocol !== "http:"
    ) {

      return null;

    }


    return url.href;

  }

  catch {

    return null;

  }

}



function getImages(condo) {


  const rows =
    Array.isArray(
      condo.listing_images
    )
      ? [...condo.listing_images]
      : [];


  rows.sort(
    function(a,b) {

      return (
        Number(a.sort_order || 0) -
        Number(b.sort_order || 0)
      );

    }
  );


  const urls =
    rows
      .map(
        item =>
          safeUrl(
            item.image_url
          )
      )
      .filter(Boolean);


  const oldCover =
    safeUrl(
      condo.image_url
    );


  if (
    oldCover &&
    !urls.includes(oldCover)
  ) {

    urls.unshift(
      oldCover
    );

  }


  return urls;

}



/* =========================
   NORMAL GALLERY
========================= */

function buildGallery(images) {


  galleryImages =
    images;


  currentImage =
    0;


  const track =
    document.getElementById(
      "galleryTrack"
    );


  const thumbs =
    document.getElementById(
      "thumbnails"
    );


  const previous =
    document.getElementById(
      "prevButton"
    );


  const next =
    document.getElementById(
      "nextButton"
    );


  const expandHint =
    document.getElementById(
      "expandHint"
    );


  track.innerHTML =
    "";


  thumbs.innerHTML =
    "";


  if (
    images.length === 0
  ) {


    const slide =
      document.createElement(
        "div"
      );


    slide.className =
      "slide";


    slide.textContent =
      "🏢";


    track.appendChild(
      slide
    );


    previous.style.display =
      "none";


    next.style.display =
      "none";


    thumbs.style.display =
      "none";


    document
      .getElementById(
        "counter"
      )
      .style.display =
      "none";


    expandHint.style.display =
      "none";


    return;

  }


  images.forEach(
    function(url,index) {


      const slide =
        document.createElement(
          "div"
        );


      slide.className =
        "slide";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        url;


      image.alt =
        `รูปคอนโด ${index + 1}`;


      image.onclick =
        function() {

          openLightbox(
            index
          );

        };


      slide.appendChild(
        image
      );


      track.appendChild(
        slide
      );


      const thumb =
        document.createElement(
          "button"
        );


      thumb.type =
        "button";


      thumb.className =
        "thumb";


      const thumbImage =
        document.createElement(
          "img"
        );


      thumbImage.src =
        url;


      thumb.appendChild(
        thumbImage
      );


      thumb.onclick =
        function() {

          goToImage(
            index
          );

        };


      thumbs.appendChild(
        thumb
      );


    }
  );


  if (
    images.length === 1
  ) {

    previous.style.display =
      "none";


    next.style.display =
      "none";


    thumbs.style.display =
      "none";

  }


  updateGalleryUI();

}



function goToImage(index) {


  if (
    galleryImages.length === 0
  ) {
    return;
  }


  currentImage =
    Math.max(
      0,
      Math.min(
        index,
        galleryImages.length - 1
      )
    );


  const track =
    document.getElementById(
      "galleryTrack"
    );


  track.scrollTo({

    left:
      track.clientWidth *
      currentImage,

    behavior:
      "smooth"

  });


  updateGalleryUI();

}



function updateGalleryUI() {


  const counter =
    document.getElementById(
      "counter"
    );


  if (
    galleryImages.length
  ) {

    counter.textContent =
      `${currentImage + 1} / ${galleryImages.length}`;

  }


  const thumbs =
    document.querySelectorAll(
      ".thumb"
    );


  thumbs.forEach(
    function(thumb,index) {

      thumb.classList.toggle(
        "active",
        index === currentImage
      );

    }
  );

}



document
  .getElementById(
    "prevButton"
  )
  .addEventListener(
    "click",
    function() {

      goToImage(
        currentImage - 1
      );

    }
  );



document
  .getElementById(
    "nextButton"
  )
  .addEventListener(
    "click",
    function() {

      goToImage(
        currentImage + 1
      );

    }
  );



let scrollTimer;


document
  .getElementById(
    "galleryTrack"
  )
  .addEventListener(
    "scroll",
    function() {


      clearTimeout(
        scrollTimer
      );


      const track =
        this;


      scrollTimer =
        setTimeout(
          function() {


            if (
              track.clientWidth === 0
            ) {
              return;
            }


            currentImage =
              Math.round(
                track.scrollLeft /
                track.clientWidth
              );


            updateGalleryUI();


          },
          80
        );

    }
  );



/* =========================
   LIGHTBOX
========================= */

function openLightbox(index) {


  if (
    galleryImages.length === 0
  ) {
    return;
  }


  lightboxIndex =
    index;


  const lightbox =
    document.getElementById(
      "lightbox"
    );


  lightbox.classList.add(
    "open"
  );


  document.body.style.overflow =
    "hidden";


  updateLightbox();

}



function closeLightbox() {


  const lightbox =
    document.getElementById(
      "lightbox"
    );


  lightbox.classList.remove(
    "open"
  );


  document.body.style.overflow =
    "";

}



function updateLightbox() {


  if (
    galleryImages.length === 0
  ) {
    return;
  }


  if (
    lightboxIndex < 0
  ) {

    lightboxIndex =
      galleryImages.length - 1;

  }


  if (
    lightboxIndex >=
    galleryImages.length
  ) {

    lightboxIndex =
      0;

  }


  document
    .getElementById(
      "lightboxImage"
    )
    .src =
    galleryImages[
      lightboxIndex
    ];


  document
    .getElementById(
      "lightboxCounter"
    )
    .textContent =
    `${lightboxIndex + 1} / ${galleryImages.length}`;


  const previous =
    document.getElementById(
      "lightboxPrev"
    );


  const next =
    document.getElementById(
      "lightboxNext"
    );


  if (
    galleryImages.length <= 1
  ) {

    previous.style.display =
      "none";

    next.style.display =
      "none";

  }

  else {

    previous.style.display =
      "block";

    next.style.display =
      "block";

  }

}



document
  .getElementById(
    "lightboxClose"
  )
  .addEventListener(
    "click",
    closeLightbox
  );



document
  .getElementById(
    "lightboxPrev"
  )
  .addEventListener(
    "click",
    function() {

      lightboxIndex--;

      updateLightbox();

    }
  );



document
  .getElementById(
    "lightboxNext"
  )
  .addEventListener(
    "click",
    function() {

      lightboxIndex++;

      updateLightbox();

    }
  );



/* แตะพื้นหลังดำเพื่อปิด */

document
  .getElementById(
    "lightbox"
  )
  .addEventListener(
    "click",
    function(event) {


      if (
        event.target === this
      ) {

        closeLightbox();

      }

    }
  );



/* =========================
   SWIPE FULLSCREEN
========================= */

let touchStartX = 0;

let touchEndX = 0;



document
  .getElementById(
    "lightboxImageWrap"
  )
  .addEventListener(
    "touchstart",
    function(event) {

      touchStartX =
        event.changedTouches[0]
          .screenX;

    },
    {
      passive: true
    }
  );



document
  .getElementById(
    "lightboxImageWrap"
  )
  .addEventListener(
    "touchend",
    function(event) {


      touchEndX =
        event.changedTouches[0]
          .screenX;


      const distance =
        touchStartX -
        touchEndX;


      if (
        Math.abs(distance) <
        50
      ) {

        return;

      }


      if (
        distance > 0
      ) {

        lightboxIndex++;

      }

      else {

        lightboxIndex--;

      }


      updateLightbox();

    },
    {
      passive: true
    }
  );



/* =========================
   LOAD CONDO
========================= */

async function loadCondo() {


  const loading =
    document.getElementById(
      "loading"
    );


  const page =
    document.getElementById(
      "page"
    );


  const errorBox =
    document.getElementById(
      "error"
    );


  try {


    const id =
      new URLSearchParams(
        window.location.search
      )
      .get("id");


    if (!id) {

      throw new Error(
        "ไม่พบ ID ของประกาศ"
      );

    }


    const response =
      await fetch(
        "/api/listings",
        {
          cache:
            "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "โหลดข้อมูลไม่สำเร็จ"
      );

    }


    const listings =
      await response.json();


    const condo =
      listings.find(
        item =>
          String(item.id) ===
          String(id)
      );


    if (!condo) {

      throw new Error(
        "ไม่พบประกาศนี้"
      );

    }


    buildGallery(
      getImages(
        condo
      )
    );


    document.title =
      `${condo.condo_name} | Pet Condo`;


    document
      .getElementById(
        "condoName"
      )
      .textContent =
      condo.condo_name ||
      "ไม่ระบุชื่อ";


    document
      .getElementById(
        "location"
      )
      .textContent =
      `📍 ${condo.location || "-"}`;


    document
      .getElementById(
        "price"
      )
      .textContent =
      `฿${Number(
        condo.price || 0
      ).toLocaleString(
        "th-TH"
      )} / เดือน`;


    let tags =
      "";


    if (
      condo.pet_dog
    ) {

      tags += `
        <span class="tag">
          🐶 เลี้ยงสุนัขได้
        </span>
      `;

    }


    if (
      condo.pet_cat
    ) {

      tags += `
        <span class="tag">
          🐱 เลี้ยงแมวได้
        </span>
      `;

    }


    document
      .getElementById(
        "petTags"
      )
      .innerHTML =
      tags;


    document
      .getElementById(
        "description"
      )
      .textContent =
      condo.description ||
      "ไม่มีรายละเอียด";


    document
      .getElementById(
        "bedrooms"
      )
      .textContent =
      `🛏️ ${condo.bedrooms ?? "-"} ห้องนอน`;


    document
      .getElementById(
        "bathrooms"
      )
      .textContent =
      `🚿 ${condo.bathrooms ?? "-"} ห้องน้ำ`;


    document
      .getElementById(
        "size"
      )
      .textContent =
      `📐 ${condo.size_sqm ?? "-"} ตร.ม.`;


    document
      .getElementById(
        "floor"
      )
      .textContent =
      `🏢 ชั้น ${condo.floor ?? "-"}`;


    document
      .getElementById(
        "contactText"
      )
      .textContent =
      condo.contact ||
      "ไม่ระบุช่องทางติดต่อ";


    loading.style.display =
      "none";


    page.style.display =
      "block";


  }

  catch(error) {


    loading.style.display =
      "none";


    errorBox.style.display =
      "block";


    errorBox.textContent =
      "❌ " +
      error.message;

  }

}



loadCondo();


</script>


</body>

</html>
